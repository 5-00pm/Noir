<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505"><title>Noir Todo</title>
<style>
:root{--bg:#050505;--card:#101012;--line:#232326;--tx:#e8e8ec;--dim:#80808a;--silver:#c4c9d4;--gold:#d4af37;--teal:#2ee6c8;--pink:#ff4d8d;--violet:#8b5cf6;--red:#ff5252}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif}
#app{display:flex;flex-direction:column;height:100%;padding-top:env(safe-area-inset-top)}
header{padding:10px 12px 6px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chip{flex:0 0 auto;padding:7px 16px;border-radius:20px;border:1px solid var(--line);background:none;color:var(--dim);font:inherit}
.chip.on{color:#000;background:var(--gold);border-color:var(--gold);font-weight:600}
h1{margin:4px 4px;font-size:20px;color:var(--silver);font-weight:600}
main{flex:1;overflow-y:auto;padding:12px}
nav{display:flex;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);background:#08080a}
nav button{flex:1;background:none;border:0;color:var(--dim);padding:10px 0 8px;font:inherit;font-size:12px}
nav button b{display:block;font-size:20px;font-weight:400}
nav button.on{color:var(--gold)}
.add{display:flex;gap:8px;margin-bottom:12px}
input{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:11px 12px;font:inherit;outline:none}
input:focus{border-color:var(--silver)}
.btn{background:var(--gold);color:#000;border:0;border-radius:10px;padding:0 16px;font:inherit;font-weight:700}
.btn.g{background:var(--card);color:var(--silver);border:1px solid var(--line)}
.sw{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin-bottom:8px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.sw::-webkit-scrollbar{display:none}
.row{flex:0 0 100%;scroll-snap-align:start;padding:12px}
.top{display:flex;gap:12px;align-items:center}
.ck{flex:0 0 24px;height:24px;border-radius:50%;border:2px solid var(--silver);background:none;color:transparent;font-size:13px;padding:0}
.ck.on{background:var(--teal);border-color:var(--teal);color:#000}
.tt{flex:1}.meta{font-size:12px;color:var(--dim);display:flex;gap:10px;flex-wrap:wrap}
.dn .tt{text-decoration:line-through;opacity:.45}
.star{color:var(--gold)}.od{color:var(--red)}.due{color:var(--violet)}
.acts{flex:0 0 auto;display:flex;scroll-snap-align:end}
.acts button{width:64px;border:0;color:#000;font-size:22px}
.sub{display:flex;gap:10px;align-items:center;padding:8px 0 0 36px;font-size:14px}.sub .ck{flex-basis:20px;height:20px;border-color:var(--dim)}
.sin{margin:10px 0 0 36px;width:calc(100% - 36px);padding:8px 10px;font-size:14px}
.sec{color:var(--dim);font-size:12px;margin:14px 4px 6px}
.empty{text-align:center;color:var(--dim);margin-top:60px}
.seg{display:flex;gap:6px;margin-bottom:10px}.seg .chip{flex:1;padding:6px}
.nv{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:var(--silver);font-weight:600}
.nv button{background:none;border:1px solid var(--line);color:var(--silver);border-radius:10px;width:40px;height:34px;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dh{text-align:center;color:var(--dim);font-size:12px}
.c{aspect-ratio:1;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--tx);font:inherit;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0}
.c.t{border-color:var(--gold);color:var(--gold)}.c.x{visibility:hidden}
.dot{width:6px;height:6px;border-radius:50%;background:var(--gold)}.dot.d{background:var(--teal)}
.wk{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.wk>button{flex:0 0 46px;background:none;border:0;color:var(--silver);font:inherit;text-align:left}.wk.t>button{color:var(--gold)}
.wk>div{flex:1}
.ti{display:flex;gap:10px;align-items:center;padding:5px 0;font-size:14px}
.cc{font-size:11px;color:var(--pink);margin-left:auto}
.yr{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,13px);grid-auto-columns:13px;gap:3px;overflow-x:auto;padding-bottom:8px}
.yr i{border-radius:3px}
.stats{display:flex;gap:10px;margin:14px 0}.stats div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;color:var(--dim);font-size:12px}
.stats b{display:block;font-size:22px;color:var(--gold)}
.ov{position:fixed;inset:0;background:#000c;display:flex;align-items:flex-end;z-index:9}
.sheet{width:100%;background:#0d0d10;border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.big{font-size:64px;text-align:center;color:var(--gold);font-variant-numeric:tabular-nums;font-weight:300}
.r{display:flex;gap:8px}.r .btn{flex:1;padding:12px}
.link{background:none;border:0;color:var(--red);font:inherit;margin:20px auto;display:block}
</style></head><body><div id="app"><header id="hd"></header><main id="mn"></main>
<nav><button data-v="tasks"><b>☰</b>Tasks</button><button data-v="cal"><b>▦</b>Calendar</button><button data-v="heat"><b>◼</b>Heatmap</button></nav></div>
<div id="ov" class="ov" style="display:none"></div>
<script>
const $=s=>document.querySelector(s),K='noir-todo-v1';
let S=JSON.parse(localStorage.getItem(K)||'null')||{cats:['Personal','Work'],cat:'Personal',tasks:[]};
const save=()=>localStorage.setItem(K,JSON.stringify(S));
const uid=()=>Math.random().toString(36).slice(2,9),pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd=s=>{const[a,b,c]=s.split('-');return new Date(+a,b-1,+c)};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MO=['January','February','March','April','May','June','July','August','September','October','November','December'];
const fmt=s=>MO[pd(s).getMonth()].slice(0,3)+' '+pd(s).getDate();
const add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
let view='tasks',cal={mode:'month',d:new Date()},hm={mode:'month',d:new Date()},T=null,fid=null;
const byId=id=>S.tasks.find(t=>t.id==id);
function mk(title,cat,due){S.tasks.push({id:uid(),t:title,cat,star:0,due:due||'',done:0,doneAt:'',subs:[],open:0});save()}
function render(){
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==view));
 const h=$('#hd');
 if(view=='tasks')h.innerHTML='<div class="tabs">'+S.cats.map(c=>`<button class="chip ${c==S.cat?'on':''}" data-a="cat" data-c="${esc(c)}">${esc(c)}</button>`).join('')+'<button class="chip" data-a="newcat">+</button></div>';
 else h.innerHTML='<h1>'+(view=='cal'?'Calendar':'Completion heatmap')+'</h1>';
 $('#mn').innerHTML=view=='tasks'?vTasks():view=='cal'?vCal():vHeat();
 if(fid){const e=document.querySelector(`.sin[data-id="${fid}"]`);if(e)e.focus()}
}
function row(t){
 const od=t.due&&!t.done&&t.due<ymd(new Date());const dn=t.subs.filter(s=>s.done).length;
 return `<div class="sw"><div class="row ${t.done?'dn':''}"><div class="top"><button class="ck ${t.done?'on':''}" data-a="tog" data-id="${t.id}">✓</button>
 <div class="tt" data-a="open" data-id="${t.id}">${esc(t.t)}<div class="meta">${t.star?'<span class="star">★ Starred</span>':''}${t.due?`<span class="${od?'od':'due'}">▣ ${fmt(t.due)}</span>`:''}${t.subs.length?`<span>${dn}/${t.subs.length} subtasks</span>`:''}</div></div></div>
 ${t.open?t.subs.map(s=>`<div class="sub"><button class="ck ${s.done?'on':''}" data-a="stog" data-id="${t.id}" data-s="${s.id}">✓</button><span style="${s.done?'text-decoration:line-through;opacity:.5':''}">${esc(s.t)}</span></div>`).join('')+`<input class="sin" data-id="${t.id}" placeholder="Add subtask…">`:''}</div>
 <div class="acts"><button style="background:var(--gold)" data-a="star" data-id="${t.id}">★</button><button style="background:var(--violet)" data-a="due" data-id="${t.id}">▣</button><button style="background:var(--teal)" data-a="focus" data-id="${t.id}">◔</button><button style="background:var(--red)" data-a="del" data-id="${t.id}">✕</button></div></div>`}
function vTasks(){
 const l=S.tasks.filter(t=>t.cat==S.cat).sort((a,b)=>a.done-b.done||b.star-a.star||(a.due||'9')<(b.due||'9')?-1:1);
 const o=l.filter(t=>!t.done),d=l.filter(t=>t.done);
 return `<div class="add"><input id="ni" placeholder="New ${esc(S.cat.toLowerCase())} task…"><button class="btn" data-a="add">Add</button></div>`+
 (o.length?o.map(row).join(''):'<div class="empty">Nothing here yet.<br>Add your first task above.</div>')+
 (d.length?'<div class="sec">Completed</div>'+d.map(row).join(''):'')+
 (S.cats.indexOf(S.cat)>1?`<button class="link" data-a="delcat">Delete “${esc(S.cat)}” category</button>`:'')}
function ti(t){return `<div class="ti"><button class="ck ${t.done?'on':''}" data-a="tog" data-id="${t.id}">✓</button><span style="${t.done?'text-decoration:line-through;opacity:.5':''}">${t.star?'<span class="star">★ </span>':''}${esc(t.t)}</span><span class="cc">${esc(t.cat)}</span></div>`}
function vCal(){
 const m=cal.mode,d=cal.d,td=ymd(new Date());
 const seg=`<div class="seg">${[['week','Week'],['month','Month'],['day','Day']].map(([k,n])=>`<button class="chip ${m==k?'on':''}" data-a="cm" data-m="${k}">${n}</button>`).join('')}</div>`;
 let title,body='';
 if(m=='month'){
  title=MO[d.getMonth()]+' '+d.getFullYear();
  const f=new Date(d.getFullYear(),d.getMonth(),1),n=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
  body='<div class="grid">'+'SMTWTFS'.split('').map(x=>`<div class="dh">${x}</div>`).join('')+'<div class="c x"></div>'.repeat(f.getDay());
  for(let i=1;i<=n;i++){const k=ymd(new Date(d.getFullYear(),d.getMonth(),i)),ts=S.tasks.filter(t=>t.due==k);
   body+=`<button class="c ${k==td?'t':''}" data-a="goday" data-d="${k}">${i}<span class="dot ${ts.length&&ts.every(t=>t.done)?'d':''}" style="${ts.length?'':'visibility:hidden'}"></span></button>`}
  body+='</div>'}
 else if(m=='week'){
  const s=add(d,-d.getDay());title=fmt(ymd(s))+' – '+fmt(ymd(add(s,6)));
  for(let i=0;i<7;i++){const x=add(s,i),k=ymd(x),ts=S.tasks.filter(t=>t.due==k);
   body+=`<div class="wk ${k==td?'t':''}"><button data-a="goday" data-d="${k}"><b>${'Sun Mon Tue Wed Thu Fri Sat'.split(' ')[i]}</b><br>${x.getDate()}</button><div>${ts.map(ti).join('')||'<span class="meta">—</span>'}</div></div>`}}
 else{
  const k=ymd(d),ts=S.tasks.filter(t=>t.due==k);
  title=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][d.getDay()]+', '+fmt(k);
  body=`<div class="add"><input id="di" placeholder="Add task for this day…"><button class="btn" data-a="dadd">Add</button></div>`+(ts.map(ti).join('')||'<div class="empty">No tasks due.</div>')}
 return seg+`<div class="nv"><button data-a="cn" data-n="-1">‹</button>${title}<button data-a="cn" data-n="1">›</button></div>`+body}
function vHeat(){
 const cnt={};S.tasks.forEach(t=>{if(t.done&&t.doneAt)cnt[t.doneAt]=(cnt[t.doneAt]||0)+1});
 const col=c=>['#141416','#4a3c0e','#8a7019','#d4af37','#ffe27a'][c?c<2?1:c<3?2:c<5?3:4:0];
 const d=hm.d,y=d.getFullYear(),m=hm.mode=='month';let cells='',tot=0,days=0,best=0;
 const seg=`<div class="seg">${[['month','Month'],['year','Year']].map(([k,n])=>`<button class="chip ${hm.mode==k?'on':''}" data-a="hm" data-m="${k}">${n}</button>`).join('')}</div>`;
 const st=m?new Date(y,d.getMonth(),1):new Date(y,0,1),en=m?new Date(y,d.getMonth()+1,0):new Date(y,11,31);
 for(let x=new Date(st);x<=en;x=add(x,1)){const c=cnt[ymd(x)]||0;tot+=c;if(c)days++;best=Math.max(best,c)}
 if(m){cells='<div class="grid">'+'SMTWTFS'.split('').map(x=>`<div class="dh">${x}</div>`).join('')+'<div class="c x"></div>'.repeat(st.getDay());
  for(let x=new Date(st);x<=en;x=add(x,1)){const c=cnt[ymd(x)]||0;cells+=`<div class="c" style="background:${col(c)};color:${c>2?'#000':'var(--dim)'}">${x.getDate()}</div>`}cells+='</div>'}
 else{cells='<div class="yr">'+'<i></i>'.repeat(st.getDay());
  for(let x=new Date(st);x<=en;x=add(x,1)){const c=cnt[ymd(x)]||0;cells+=`<i style="background:${col(c)}" title="${ymd(x)}: ${c}"></i>`}cells+='</div>'}
 return seg+`<div class="nv"><button data-a="hn" data-n="-1">‹</button>${m?MO[d.getMonth()]+' ':''}${y}<button data-a="hn" data-n="1">›</button></div>`+cells+
 `<div class="stats"><div><b>${tot}</b>completed</div><div><b>${days}</b>active days</div><div><b>${best}</b>best day</div></div>`}
function sheet(h){const o=$('#ov');o.innerHTML='<div class="sheet">'+h+'</div>';o.style.display='flex'}
function closeS(){$('#ov').style.display='none';T=null}
function fmtT(s){return pad(Math.floor(s/60))+':'+pad(s%60)}
function timerUI(){const t=byId(T.id);sheet(`<div style="text-align:center;color:var(--silver)">Focus · ${esc(t?t.t:'')}</div><div class="big" id="tm">${fmtT(T.left)}</div>
 <div class="r">${[15,25,45].map(n=>`<button class="btn g" data-a="pm" data-m="${n}">${n} min</button>`).join('')}</div>
 <div class="r"><button class="btn" data-a="tgo">${T.run?'Pause':'Start'}</button><button class="btn g" data-a="close">Close</button></div>`)}
setInterval(()=>{if(T&&T.run){T.left=Math.max(0,Math.round((T.end-Date.now())/1000));const e=$('#tm');if(e)e.textContent=fmtT(T.left);if(!T.left){T.run=0;navigator.vibrate&&navigator.vibrate([300,150,300]);timerUI();$('#tm').textContent='Done ✓'}}},250);
function setDone(t,v){t.done=v?1:0;t.doneAt=v?ymd(new Date()):''}
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-v],[data-a]');if(!b)return;
 if(b.dataset.v){view=b.dataset.v;fid=null;return render()}
 const a=b.dataset.a,t=b.dataset.id?byId(b.dataset.id):null;fid=null;
 if(a=='cat'){S.cat=b.dataset.c;save()}
 else if(a=='newcat')return sheet('<input id="nc" placeholder="Category name" maxlength="20"><div class="r"><button class="btn" data-a="savecat">Create</button><button class="btn g" data-a="close">Cancel</button></div>');
 else if(a=='savecat'){const v=$('#nc').value.trim();if(v&&!S.cats.includes(v)){S.cats.push(v);S.cat=v;save()}closeS()}
 else if(a=='delcat'){if(confirm('Delete this category and its tasks?')){S.tasks=S.tasks.filter(x=>x.cat!=S.cat);S.cats=S.cats.filter(x=>x!=S.cat);S.cat='Personal';save()}}
 else if(a=='add'){const v=$('#ni').value.trim();if(v)mk(v,S.cat)}
 else if(a=='dadd'){const v=$('#di').value.trim();if(v)mk(v,S.cat,ymd(cal.d))}
 else if(a=='tog')setDone(t,!t.done),save();
 else if(a=='stog'){const s=t.subs.find(x=>x.id==b.dataset.s);s.done=!s.done;save()}
 else if(a=='open')t.open=!t.open;
 else if(a=='star'){t.star=t.star?0:1;save()}
 else if(a=='del'){if(confirm('Delete this task?')){S.tasks=S.tasks.filter(x=>x!=t);save()}}
 else if(a=='due')return sheet(`<div style="color:var(--silver)">Deadline</div><input type="date" id="dd" value="${t.due}"><div class="r"><button class="btn" data-a="sd" data-id="${t.id}">Save</button><button class="btn g" data-a="cd" data-id="${t.id}">Clear</button></div>`);
 else if(a=='sd'){t.due=$('#dd').value;save();closeS()}
 else if(a=='cd'){t.due='';save();closeS()}
 else if(a=='focus'){T={id:t.id,left:1500,run:0,end:0};return timerUI()}
 else if(a=='pm'){T.left=+b.dataset.m*60;T.run=0;return timerUI()}
 else if(a=='tgo'){T.run=!T.run;if(T.run)T.end=Date.now()+T.left*1000;return timerUI()}
 else if(a=='close')return closeS();
 else if(a=='cm')cal.mode=b.dataset.m;
 else if(a=='goday'){cal.d=pd(b.dataset.d);cal.mode='day'}
 else if(a=='cn'){const n=+b.dataset.n;if(cal.mode=='month')cal.d=new Date(cal.d.getFullYear(),cal.d.getMonth()+n,1);else cal.d=add(cal.d,n*(cal.mode=='week'?7:1))}
 else if(a=='hm')hm.mode=b.dataset.m;
 else if(a=='hn'){const n=+b.dataset.n;hm.d=hm.mode=='month'?new Date(hm.d.getFullYear(),hm.d.getMonth()+n,1):new Date(hm.d.getFullYear()+n,0,1)}
 render()});
document.addEventListener('keydown',e=>{if(e.key!='Enter')return;const i=e.target;
 if(i.id=='ni'||i.id=='di')return i.nextElementSibling.click();
 if(i.classList.contains('sin')){const v=i.value.trim(),t=byId(i.dataset.id);if(v){t.subs.push({id:uid(),t:v,done:0});save();fid=t.id;render()}}});
render();
</script></body></html>
